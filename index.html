<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="refresh" content="300" />
<title>Martha Cove Marina - Web Cam</title>
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="stylesheet" type="text/css" href="imagesize.css" />
<style type="text/css">
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background-color: #000000;
    color: #FFFFFF;
    font-family: Arial, sans-serif;
    /* Stop iPhone Safari enlarging text when the phone is turned sideways */
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  a, a:visited { color: #FFFFFF; }

  .page {
    max-width: 100%;
    padding: 10px;
    text-align: center;
  }

  h1 {
    font-size: 1.4rem;
    margin: 10px 0;
  }

  .intro {
    font-size: 0.85rem;
    margin: 0 auto 15px;
    max-width: 900px;
  }

  /* Larger text only on big screens (desktops), not phones in landscape */
  @media (min-width: 1100px) {
    h1 { font-size: 2.4rem; }
    .intro { font-size: 1.1rem; }
  }

  /* Cameras sit side by side on wide screens, stacked on narrow ones */
  .cams {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0;
    width: 100%;
  }

  /* Portrait: stacked, full width */
  .cam {
    flex: 0 0 100%;
    max-width: 100%;
  }

  /* Landscape (phones turned sideways, and desktops): side by side */
  @media (orientation: landscape) {
    .cam {
      flex: 0 0 50%;
      max-width: 50%;
    }
  }

  /* Images always shrink to fit the screen width and height */
  .cam img {
    display: block;
    width: 100% !important;
    height: auto !important;
    max-width: 100% !important;
    margin: 0;
    border: 0;
  }
</style>
<script type="text/javascript">
function right(e) {
  var msg = "Function Disabled";
  e = e || window.event;
  if (e && (e.which == 3 || e.button == 2)) {
    alert(msg);
    return false;
  }
  return true;
}

function trap() {
  if (document.images) {
    for (var i = 0; i < document.images.length; i++) {
      document.images[i].onmousedown = right;
      document.images[i].onmouseup = right;
    }
  }
}

var urlAddress = "http://www.martha-cove.com";
var pageName = "Martha Cove";

function addToFavorites() {
  if (window.external && window.external.AddFavorite) {
    window.external.AddFavorite(urlAddress, pageName);
  } else {
    alert("Sorry! Your browser doesn't support this function.");
  }
}
</script>
</head>

<body onload="trap()">
<div class="page">
  <h1>Martha Cove Marina - Web Cam</h1>

  <p class="intro">
    Latest images below. To view latest time-lapse series click anywhere in an image and a new window will open.<br />
    In the new window you can also view an earlier series using the pop-up calendar and selecting a date and time.
  </p>

  <div class="cams">
    <div class="cam">
      <a href="https://www.cameraftp.com/Camera/Cameraplayer.aspx?parentID=354175512&amp;shareID=17219949">
        <img src="https://cameraftpapi.drivehq.com/api/Camera/GetLastCameraImage.aspx?shareID=17219949&amp;index=0" alt="Martha Cove Marina web cam 1" />
      </a>
    </div>
    <div class="cam">
      <a href="https://www.cameraftp.com/Camera/Cameraplayer.aspx?parentID=354175514&amp;shareID=17219942">
        <img src="https://cameraftpapi.drivehq.com/api/Camera/GetLastCameraImage.aspx?shareID=17219942&amp;index=0" alt="Martha Cove Marina web cam 2" />
      </a>
    </div>
  </div>
<!-- The container where your live count will be displayed -->
<p>This page has been viewed <span id="hit-count" style="font-weight: bold; color: #007bff;">Loading...</span> times.</p>
<script>
  // 1. Enter your GitHub details to keep your counter unique
  const namespace = "github-pages-yourusername"; // e.g., "github-pages-johndoe"
  const key = "your-repository-name";           // e.g., "my-portfolio"

  // 2. Fetch the counter data and increment it by 1 automatically
  fetch(`https://countapi.xyz{namespace}/${key}`)
    .then(response => {
      if (!response.ok) throw new Error("API network error");
      return response.json();
    })
    .then(data => {
      // 3. Add your 10,000 legacy hits directly to the recorded live database hits
      const totalHits = data.value + 10000;
      
      // 4. Inject the combined total cleanly with formatting commas
      document.getElementById("hit-count").innerText = totalHits.toLocaleString();
    })
    .catch(error => {
      console.error("Counter failed to load:", error);
      // Fallback display so users always see your legacy baseline minimum
      document.getElementById("hit-count").innerText = "10,000+";
    });
</script>
</div>
</body>
</html>
