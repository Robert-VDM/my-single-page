name: Update Martha Cove Weather & Tides

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  # Allows manual testing from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest weather and tide data
        env:
          # Add any API keys you use in Repo Settings -> Secrets and variables -> Actions
          TIDE_API_KEY: ${{ secrets.TIDE_API_KEY }}
        run: node scripts/update-data.js

      - name: Commit and push updated JSON
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weather.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update marine weather data" && git push)
